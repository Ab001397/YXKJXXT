<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="开机小学堂"><meta name="theme-color" content="#fff4db"><title>开机小学堂</title><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#24344a;background:#fff4db}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 10% 0,#ffe2b6,transparent 40%),linear-gradient(145deg,#fff9e8,#e5f6ff)}main{max-width:740px;margin:auto;padding:28px 18px 60px}.card{background:#fff;border-radius:28px;padding:28px;box-shadow:0 14px 40px #4a71901c}header{text-align:center;margin:20px 0 28px}h1{font-size:clamp(30px,6vw,48px);margin:8px}h2{font-size:26px}.muted{color:#65758c}.pill{display:inline-block;border-radius:99px;background:#f0f5ff;padding:8px 15px;font-weight:700}.big{font-size:clamp(40px,10vw,78px);font-weight:800;text-align:center;margin:28px 0}button{font:inherit;border:0;border-radius:18px;padding:16px 20px;cursor:pointer;font-weight:750}button:focus-visible{outline:3px solid #305eff;outline-offset:3px}.primary{background:#4e7dff;color:white;width:100%;font-size:20px}.option{background:#eef4ff;color:#223654;min-height:85px;font-size:34px}.option:disabled{opacity:.65}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.ok{background:#d9f9e6}.wrong{background:#ffe5e4}.feedback{font-size:20px;font-weight:700;min-height:30px;margin:18px 0}.progress{height:13px;background:#edf0f6;border-radius:99px;overflow:hidden;margin:18px 0}.progress>div{height:100%;background:#55c9a0;transition:width .25s}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.small{font-size:14px}.secondary{background:#f1f3f8}.hide{display:none}.stars{font-size:56px;text-align:center}.footer{text-align:center;margin-top:18px;font-size:13px;color:#65758c}@media(max-width:420px){.card{padding:20px}.option{min-height:70px;font-size:27px}}</style></head><body><main><header><div style="font-size:60px">📚🌟</div><h1>开机小学堂</h1><div class="muted">每天认识10个汉字 · 完成5道20以内数学题</div></header><section class="card" id="welcome"><span class="pill">今日学习挑战</span><h2>准备好了吗？</h2><p>先认识10个汉字，再完成5道数学题。答错也没关系，认真学习最重要！</p><p class="muted small" id="last"></p><button class="primary" id="start">开始学习 🚀</button></section><section class="card hide" id="quiz"><div class="row"><span class="pill" id="category"></span><span id="counter" class="muted"></span></div><div class="progress"><div id="bar"></div></div><p class="muted" id="instruction"></p><div class="big" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="primary hide" id="next">下一题 →</button><button class="secondary" id="speak" style="margin-top:12px">🔊 听读音</button></section><section class="card hide" id="done"><div class="stars">🌟🌟🌟</div><h2 style="text-align:center">挑战完成！</h2><p style="text-align:center">你完成了10个汉字和5道数学题，真棒！</p><p id="summary" class="muted" style="text-align:center"></p><button class="primary" id="restart">再练习一次</button></section><div class="footer">本应用为学习工具，不能替代 iPad 系统锁屏或自动限制其他 App。</div></main><script>const groups=[['山','shān'],['水','shuǐ'],['日','rì'],['月','yuè'],['火','huǒ'],['木','mù'],['田','tián'],['土','tǔ'],['人','rén'],['口','kǒu'],['手','shǒu'],['目','mù'],['耳','ěr'],['云','yún'],['雨','yǔ'],['花','huā'],['草','cǎo'],['大','dà'],['小','xiǎo'],['上','shàng'],['下','xià'],['左','zuǒ'],['右','yòu'],['天','tiān'],['地','dì'],['风','fēng'],['虫','chóng'],['鱼','yú'],['鸟','niǎo'],['马','mǎ']];const $=id=>document.getElementById(id);const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};let questions=[],idx=0,mistakes=0,locked=false;function show(id){for(let x of ['welcome','quiz','done'])$(x).classList.toggle('hide',x!==id)}function makeQuestions(){let chars=shuffle(groups).slice(0,10).map(([char,py])=>({type:'char',prompt:'找出读作「'+py+'」的汉字',answer:char,options:shuffle([char,...shuffle(groups.filter(g=>g[0]!==char)).slice(0,2).map(g=>g[0])])}));let maths=[];for(let i=0;i<5;i++){let plus=Math.random()<.5,a,b,ans;if(plus){a=Math.floor(Math.random()*20)+1;b=Math.floor(Math.random()*(21-a));ans=a+b}else{a=Math.floor(Math.random()*21);b=Math.floor(Math.random()*(a+1));ans=a-b}let distractors=shuffle(Array.from({length:21},(_,j)=>j).filter(n=>n!==ans)).slice(0,2);maths.push({type:'math',prompt:a+(plus?' + ':' − ')+b+' = ?',answer:String(ans),options:shuffle([String(ans),...distractors.map(String)])})}return [...chars,...maths]}function start(){questions=makeQuestions();idx=0;mistakes=0;show('quiz');render()}function speak(){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let q=questions[idx];let u=new SpeechSynthesisUtterance(q.type==='char'?q.answer:q.prompt.replace('= ?','等于多少'));u.lang='zh-CN';u.rate=.75;window.speechSynthesis.speak(u)}function render(){locked=false;let q=questions[idx];$('category').textContent=q.type==='char'?'📖 汉字识读':'🔢 数学计算';$('counter').textContent=(idx+1)+' / 15';$('bar').style.width=(idx/15*100)+'%';$('instruction').textContent=q.type==='char'?'选择正确的汉字':'选择正确答案（结果在0～20之间）';$('question').textContent=q.prompt;$('options').replaceChildren();$('feedback').textContent='';$('next').classList.add('hide');$('speak').style.display=q.type==='char'?'inline-block':'none';for(let opt of q.options){let btn=document.createElement('button');btn.className='option';btn.textContent=opt;btn.addEventListener('click',()=>answer(btn,opt));$('options').append(btn)}}function answer(btn,opt){if(locked)return;let q=questions[idx];if(opt===q.answer){locked=true;btn.classList.add('ok');$('feedback').textContent='答对啦！太棒了 🎉';for(let b of $('options').children)b.disabled=true;$('next').classList.remove('hide')}else{mistakes++;btn.classList.add('wrong');btn.disabled=true;$('feedback').textContent='再试一次，你一定可以！ 💪'}}function next(){idx++;if(idx===15){let date=new Date().toLocaleDateString('zh-CN');try{localStorage.setItem('schoolLast',JSON.stringify({date,mistakes}))}catch(e){}$('summary').textContent='本次答错尝试：'+mistakes+' 次 · 完成日期：'+date;show('done')}else render()}$('start').addEventListener('click',start);$('restart').addEventListener('click',start);$('next').addEventListener('click',next);$('speak').addEventListener('click',speak);try{let v=JSON.parse(localStorage.getItem('schoolLast')||'null');if(v)$('last').textContent='上次完成：'+v.date+' · 答错尝试 '+v.mistakes+' 次'}catch(e){}</script></body></html>
